<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Newsletter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&display=swap"
    rel="stylesheet" />

  <!-- Custom CSS -->
  <link href="/Styles/Custom.css" rel="stylesheet" />

</head>

<body>

<div id="nimbus-navbar-placeholder"></div>

  <!-- Hero Section -->
  <section class="hero-section d-flex align-items-center">
    <div class="hero-bgs">
      <img src="/Assets/jobs-header.png" alt="Hero Background" />
    </div>
    <div class="container py-5 hero-content text-start">
      <h1 class="text-center heading-xl">NEWSLETTER</h1>
      <div class="text-center wave-underline">
        <svg viewBox="0 0 140 30" height="25" xmlns="http://www.w3.org/2000/svg">
          <path d="M10,10 Q20,30 30,10 Q40,30 50,10 Q60,30 70,10 Q80,30 90,10"
                fill="none" stroke="#fff" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <div class="row justify-content-center gx-2 gy-2">
  <!-- Email input -->
  <div class="col-md-4">
    <input
      type="email"
      class="form-control form-control-lg"
      placeholder="Enter Your Email"
      required
    >
  </div>

  <!-- Subscribe button -->
  <div class="col-md-3 d-grid">
    <button type="submit" class="btn nimbus-btn btn-lg">
      <i class="fas fa-sun me-2"></i>
      Subscribe
    </button>
  </div>
</div>

    </div>
  </section>

  <div class="hero-rope-divider"></div>
  <section class="nimbus-split-section ">
    <img src="/Assets/DashboardAnchor.png" alt="Anchor" class="anchor-fixed anchor-top-right" />
 </section>
  










<div id="nimbus-Footer-placeholder"></div>


  <!-- Bootstrap Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/Js/Scripts.js"></script>
</body>

</html>
