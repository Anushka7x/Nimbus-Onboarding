<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Jobs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <!-- Custom CSS -->
  <link href="/Styles/Custom.css" rel="stylesheet" />

</head>

<body>

<div id="nimbus-navbar-placeholder"></div>

<!-- Hero Section -->
  <section class="hero-section d-flex align-items-center">
    <div class="hero-bgs">
      <img src="/Assets/jobs-header.png" alt="Hero Background" />
    </div>
    <div class="container py-5 hero-content text-center">
      <h1 class="heading-xl">JOBS</h1>
      <div class="wave-underline">
        <svg viewBox="0 0 100 30" height="25" xmlns="http://www.w3.org/2000/svg">
          <path d="M10,10 Q20,30 30,10 Q40,30 50,10 Q60,30 70,10 Q80,30 90,10"
                fill="none" stroke="#fff" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
  </section>

  <!-- Card Section -->
  <div class="hero-rope-divider"></div>

  <section class="nimbus-split-section">
    <img src="/Assets/DashboardAnchor.png" alt="Anchor" class="anchor-fixed anchor-top-right" />
    <div class="jobs-bg nimbus-split-text">
      <h2 class="heading-lg">Jobs</h2>
      <div class="wave-underline">
        <svg viewBox="0 0 140 30" height="25" xmlns="http://www.w3.org/2000/svg">
          <path d="M10,10 Q20,30 30,10 Q40,30 50,10 Q60,30 70,10 Q80,30 90,10"
                fill="none" stroke="#b12724" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      

    <!-- Keywords & Location -->
    <div class="mb-3 mt-3">
      <input type="text" class="form-control" placeholder="Keywords">
    </div>
    <div class="mb-3 mt-3">
      <input type="text" class="form-control" placeholder="Location">
    </div>

    <!-- Remote checkbox -->
    <div class="form-check mb-4">
      <input class="form-check-input" type="checkbox" id="remoteOnly">
      <label class="form-check-label" for="remoteOnly">
        Remote Positions Only
      </label>
    </div>

    <!-- Submit button -->
    <button type="submit" class="u-btn w-100 mb-4">
      <i class="fas fa-sun"></i> Search Job
    </button>

    <!-- Job type checkboxes -->
    <div class="row gx-5">
      <!-- Left column -->
      <div class="col-sm-6">
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="freelance">
          <label class="form-check-label" for="freelance">Freelance</label>
        </div>
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="fulltime">
          <label class="form-check-label" for="fulltime">Full Time</label>
        </div>
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="internship">
          <label class="form-check-label" for="internship">Internship</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="marine">
          <label class="form-check-label" for="marine">Marine</label>
        </div>
      </div>
      <!-- Right column -->
      <div class="col-sm-6">
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="offshore">
          <label class="form-check-label" for="offshore">Offshore</label>
        </div>
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="onshore">
          <label class="form-check-label" for="onshore">Onshore</label>
        </div>
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="parttime">
          <label class="form-check-label" for="parttime">Part Time</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="temporary">
          <label class="form-check-label" for="temporary">Temporary</label>
        </div>
      </div>
    </div>
  </div>
</form>
    </div>

    <div class="nimbus-split-image">
      <div class="nimbus-img-decor"></div>
      <div class="img-box">
        <img src="/Assets/Useourservice.png" alt="Use Our Services" />
      </div>
      <img src="/Assets/DashboardAnchor.png" alt="Anchor" class="anchor-fixed anchor-bottom-left" />
    </div>
      

      
      
    </div>
  </section>










<div id="nimbus-Footer-placeholder"></div>

  <!-- Bootstrap Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/Js/Scripts.js"></script>
</body>

</html>
